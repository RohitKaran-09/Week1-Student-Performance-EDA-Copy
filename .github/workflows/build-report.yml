name: Build official UCI EDA report

on:
  push:
    branches: [main]
    paths:
      - 'student_performance_eda.py'
      - 'requirements.txt'
      - 'README.md'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Acquire official UCI data and build analysis/report
        run: python student_performance_eda.py
      - name: Save generated results as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: official-uci-eda-results
          path: |
            Week1_Student_Performance_EDA_Report.docx
            data/student-mat.csv
            outputs/
            visualizations/
          if-no-files-found: error
      - name: Commit report and generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/student-mat.csv outputs visualizations Week1_Student_Performance_EDA_Report.docx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add official UCI analysis results and report"
            git push
          fi
