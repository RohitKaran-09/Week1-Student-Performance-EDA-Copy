name: Build Week 4 Machine Learning Report

on:
  push:
    branches: [main]
    paths:
      - 'Week4-Machine-Learning-Model-Development/**'
      - '.github/workflows/week4-machine-learning.yml'
  workflow_dispatch:

concurrency:
  group: week4-machine-learning-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Week 4 dependencies
        run: python -m pip install --upgrade pip && pip install -r Week4-Machine-Learning-Model-Development/requirements.txt
      - name: Train and evaluate models and generate deliverables
        working-directory: Week4-Machine-Learning-Model-Development
        run: python week4_model_development.py
      - name: Upload generated report, figures and metrics
        uses: actions/upload-artifact@v4
        with:
          name: week4-machine-learning-report
          path: |
            Week4-Machine-Learning-Model-Development/Week4_Machine_Learning_Model_Development_Report.docx
            Week4-Machine-Learning-Model-Development/Submission_Description.docx
            Week4-Machine-Learning-Model-Development/visualizations/
            Week4-Machine-Learning-Model-Development/outputs/
          if-no-files-found: error
      - name: Commit generated report and evaluation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Week4-Machine-Learning-Model-Development/Week4_Machine_Learning_Model_Development_Report.docx Week4-Machine-Learning-Model-Development/Submission_Description.docx Week4-Machine-Learning-Model-Development/visualizations Week4-Machine-Learning-Model-Development/outputs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add Week 4 machine learning evaluation report and results"
            git pull --rebase origin main
            git push
          fi
